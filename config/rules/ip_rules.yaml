# =============================================================================
# IP-SAKTI Sahayak — IP Agent Rules
# Loaded by the Rule Engine (Stage 4).
#
# Schema per rule:
#   id:          unique rule identifier (string)
#   description: human-readable explanation
#   conditions:  list of key-value pairs that must all match the QueryContext
#   actions:     list of directives emitted when all conditions are met
#                  - route_to_agent: <agent_id>
#                  - set_flag: <flag_name>
#                  - require_jurisdiction: <jurisdiction_id>
#                  - add_filter: <filter_name>
# =============================================================================

rules: []

